<html lang="fr">
<head>

<style>
:root {
  --rouge: #C8402F; --vert: #2E6B57; --jaune: #F2C43D;
  --fond: #F3EEE4; --surface: #FFFFFF; --texte: #2C2A26; --texte-doux: #6B6557;
  --bordure: #DDD5C5;
  --renard-orange: #E8793C; --renard-creme: #FBF6EC; --renard-brun: #3D2817; --renard-sombre: #2A1A0D;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
body { height: 100%; margin: 0; background: var(--fond); color: var(--texte); }
#app { min-height: 100%; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; position: relative; }
button { font-family: inherit; cursor: pointer; border: none; }
input, textarea { font-family: inherit; }
.btn { background: var(--rouge); color: #fff; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 600; width: 100%; }
.btn:disabled { opacity: .5; }
.btn-outline { background: transparent; color: var(--rouge); border: 2px solid var(--rouge); padding: 12px; border-radius: 14px; font-weight: 600; width: 100%; }
.btn-text { background: none; color: var(--texte-doux); padding: 10px; text-decoration: underline; }
.champ { width: 100%; padding: 14px; border: 2px solid var(--bordure); border-radius: 12px; font-size: 16px; margin-bottom: 10px; background: var(--surface); color: var(--texte); }
.carte { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.centre { display: flex; flex-direction: column; align-items: center; text-align: center; }
.ecran { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 12px; }
.tobi-mascot { width: 160px; height: auto; flex-shrink: 0; }
.tobi-mascot.anim-respire { animation: respire 3s ease-in-out infinite; }
.tobi-mascot.anim-rebond { animation: rebond .6s ease-in-out infinite; }
@keyframes respire { 0%,100% { transform: scale(1); } 50% { transform: scale(1.015); } }
@keyframes rebond { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.tobi-mini { width: 30px; height: 30px; flex-shrink: 0; margin-top: 2px; }
.ligne-bulle { display: flex; gap: 6px; align-items: flex-end; }
.ligne-bulle.enfant { justify-content: flex-end; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 18px; margin: 0; }
p { margin: 0; color: var(--texte-doux); font-size: 14px; }
.erreur { color: var(--rouge); font-size: 13px; }
.grille { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.carte-matiere { background: var(--surface); border-radius: 16px; padding: 20px 10px; text-align: center; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.bandeau-hors-ligne { background: #FDECEA; color: var(--rouge); padding: 8px; text-align: center; font-size: 13px; }
.tableau-zone { display: flex; gap: 6px; padding: 0 12px; }
.tableau { flex: 1; background: #FDFDFB; border: 3px solid #C9CDD2; border-radius: 10px; padding: 16px; min-height: 90px; display: flex; align-items: center; font-size: 20px; font-weight: 700; color: var(--vert); }
.messages { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
.bulle { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.4; }
.bulle.tobi { align-self: flex-start; background: #E9F3EC; }
.bulle.enfant { align-self: flex-end; background: #FDE7E4; }
.barre-saisie { display: flex; gap: 8px; padding: 10px 12px; align-items: center; background: var(--fond); }
.champ-saisie { flex: 1; padding: 12px 16px; border-radius: 24px; border: 2px solid var(--bordure); background: var(--surface); font-size: 15px; }
.rond-bouton { width: 46px; height: 46px; border-radius: 50%; background: var(--rouge); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.rond-bouton:disabled { opacity: .4; }
.ardoise-cadre { margin: 0 12px; background: #8A5A2E; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.ardoise-corps { display: flex; gap: 6px; }
.ardoise-canvas { flex: 1; background: #2F4A3A; border-radius: 8px; touch-action: none; }
.outils-ardoise { display: flex; flex-direction: column; gap: 6px; width: 40px; }
.outil { width: 100%; aspect-ratio: 1; border-radius: 8px; background: #F4EDE0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.outil.actif { background: var(--jaune); border: 2px solid #5A3E00; }
.bouton-montrer { background: var(--rouge); color: #fff; border-radius: 10px; font-weight: 700; font-size: 14px; padding: 10px; width: 100%; }
.bouton-montrer:disabled { background: #B08A6A; }
.ecoute-badge { text-align: center; font-size: 12px; color: var(--vert); padding: 4px; }
.spinner { width: 20px; height: 20px; border: 3px solid var(--bordure); border-top-color: var(--rouge); border-radius: 50%; animation: tourner .8s linear infinite; }
@keyframes tourner { to { transform: rotate(360deg); } }
.chip { padding: 8px 14px; border-radius: 20px; border: 2px solid var(--bordure); background: var(--surface); font-weight: 600; }
.chip.actif { background: var(--rouge); color: #fff; border-color: var(--rouge); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.entete { display: flex; align-items: center; gap: 10px; padding: 12px; }
.top-bar { display:flex; justify-content:space-between; align-items:center; padding: 10px 14px; }
.badge-direct { background: var(--rouge); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 12px; }
.pin-points { display: flex; gap: 14px; justify-content: center; margin: 18px 0 6px; }
.pin-point { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--rouge); }
.pin-point.plein { background: var(--rouge); }
.pin-clavier { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; justify-content: center; margin-top: 14px; }
.pin-touche { width: 72px; height: 72px; border-radius: 50%; background: var(--surface); color: var(--texte); font-size: 26px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.pin-touche:active { background: var(--bordure); }
.pin-touche.vide { visibility: hidden; box-shadow: none; }
.onglets { display: flex; gap: 8px; }
.onglet { flex: 1; padding: 10px; border-radius: 12px; background: var(--surface); border: 2px solid var(--bordure); font-weight: 600; color: var(--texte); }
.onglet.actif { background: var(--vert); color: #fff; border-color: var(--vert); }
.texte-arabe { direction: rtl; text-align: right; font-family: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", "Scheherazade New", serif; color: var(--texte); }
.dua-ar { font-size: 24px; line-height: 2; }
.dua-fr { font-size: 14px; color: var(--texte); margin-top: 6px; }
.dua-ref { font-size: 12px; color: var(--texte-doux); margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn-ecoute { background: var(--vert); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 14px; flex-shrink: 0; }
.livre-ar { font-size: 20px; line-height: 1.7; }
.lien-livre { display: inline-block; margin-top: 8px; background: var(--vert); color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 13px; text-decoration: none; }
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #1C1B18; --surface: #2A2823; --texte: #F0ECE3; --texte-doux: #A69E8E; --bordure: #3D3A33;
  }
  .bulle.tobi { background: #22362B; } .bulle.enfant { background: #3A2622; }
}
:root[data-theme="dark"] {
  --fond: #1C1B18; --surface: #2A2823; --texte: #F0ECE3; --texte-doux: #A69E8E; --bordure: #3D3A33;
}

#app { padding-bottom: 0; }
.nav-bas { position: sticky; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--bordure); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; font-size: 12px; color: var(--texte-doux); font-weight: 600; }
.nav-btn .ic { font-size: 22px; }
.nav-btn.actif { color: var(--rouge); }
.pf-entete { display: flex; align-items: center; justify-content: space-between; }
.liste-contenus { display: flex; flex-direction: column; gap: 10px; }
.carte-contenu { display: flex; gap: 12px; background: var(--surface); border-radius: 14px; padding: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); cursor: pointer; }
.vignette { position: relative; flex: 0 0 128px; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: var(--bordure); display: flex; align-items: center; justify-content: center; }
.vignette img { width: 100%; height: 100%; object-fit: cover; }
.vig-ic { font-size: 32px; }
.vig-dur { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.75); color: #fff; font-size: 11px; padding: 1px 5px; border-radius: 6px; }
.carte-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 12px; color: var(--texte-doux); }
.carte-txt b { font-size: 15px; color: var(--texte); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.defil { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
.defil .chip { white-space: nowrap; }
.barre { height: 10px; background: var(--bordure); border-radius: 6px; overflow: hidden; }
.barre i { display: block; height: 100%; width: 0; background: var(--vert); transition: width .2s; }
.lecteur-video { width: 100%; max-height: 70vh; background: #000; border-radius: 12px; }
.lecteur-audio, .lecteur-doc { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; background: var(--surface); border-radius: 12px; }
.lecteur-audio img, .lecteur-doc img { max-width: 60%; border-radius: 10px; }
.lecteur-audio audio { width: 100%; }
.lecteur-image { width: 100%; border-radius: 12px; }
.badge { display: inline-block; background: var(--bordure); color: var(--texte); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
.desc { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
.ligne-menu { display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 600; }
.bloc-pub { display: flex; flex-direction: column; gap: 6px; }
.actions-pub { display: flex; gap: 8px; flex-wrap: wrap; }
.actions-pub button { padding: 6px 12px; border-radius: 10px; background: var(--bordure); color: var(--texte); font-size: 13px; font-weight: 600; }
textarea.champ { min-height: 90px; resize: vertical; font-family: inherit; }
.poste { background: var(--surface); border-radius: 14px; padding: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1); display: flex; flex-direction: column; gap: 8px; }
.poste-tete { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.poste-tete small { color: var(--texte-doux); }
.poste-av { width: 36px; height: 36px; border-radius: 50%; background: var(--rouge); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.poste-titre { font-weight: 600; }
.poste-pied { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--texte-doux); }
.nav-btn { min-width: 0; font-size: 11px; }
</style>

<script>
function tobiBras(cote, humeur) {
  const sx = cote === "g" ? 66 : 134;
  let rotation = 0, extra = "";
  if (humeur === "explique" && cote === "d") { rotation = -55; extra = `<line x1="0" y1="52" x2="-6" y2="85" stroke="var(--renard-brun)" stroke-width="3" stroke-linecap="round" transform="translate(${sx} 140)"/>`; }
  if (humeur === "reflechit" && cote === "d") rotation = -128;
  if (humeur === "celebre") rotation = cote === "g" ? 150 : -150;
  if (humeur === "encourage" && cote === "d") rotation = -150;
  const main = (humeur === "encourage" && cote === "d")
    ? `<rect x="-11" y="44" width="22" height="20" rx="8" fill="var(--renard-orange)" stroke="var(--renard-brun)" stroke-width="2.5"/>`
    : `<circle cx="0" cy="55" r="11" fill="var(--renard-orange)" stroke="var(--renard-brun)" stroke-width="2.5"/>`;
  return `
    <g transform="translate(${sx} 140) rotate(${rotation})">
      <rect x="-11" y="-5" width="22" height="55" rx="11" fill="#FFFFFF" stroke="var(--renard-brun)" stroke-width="2.5"/>
      ${main}
      ${extra}
    </g>`;
}

function tobiVisage(humeur) {
  let sourcils, bouche, dx = 0, dy = 0;
  switch (humeur) {
    case "explique":
      sourcils = `<rect x="70" y="47" width="20" height="4.5" rx="2.2" fill="var(--renard-brun)" transform="rotate(-12 80 49)"/>
                  <rect x="110" y="47" width="20" height="4.5" rx="2.2" fill="var(--renard-brun)" transform="rotate(12 120 49)"/>`;
      bouche = `<ellipse cx="100" cy="106" rx="8" ry="6" fill="var(--renard-sombre)"/>`; break;
    case "reflechit":
      sourcils = `<rect x="70" y="52" width="18" height="4" rx="2" fill="var(--renard-brun)"/>
                  <rect x="108" y="43" width="20" height="4.5" rx="2.2" fill="var(--renard-brun)" transform="rotate(-18 118 45)"/>`;
      bouche = `<path d="M90,107 L111,104" stroke="var(--renard-brun)" stroke-width="3.5" stroke-linecap="round" fill="none"/>`;
      dx = 2; dy = -3; break;
    case "celebre":
      sourcils = `<rect x="68" y="42" width="20" height="4.5" rx="2.2" fill="var(--renard-brun)" transform="rotate(-18 78 44)"/>
                  <rect x="112" y="42" width="20" height="4.5" rx="2.2" fill="var(--renard-brun)" transform="rotate(18 122 44)"/>`;
      bouche = `<path d="M78,100 Q100,126 122,100 Q100,114 78,100 Z" fill="var(--renard-sombre)"/>`; break;
    case "encourage":
      sourcils = `<rect x="71" y="49" width="19" height="4.5" rx="2.2" fill="var(--renard-brun)" transform="rotate(-8 81 51)"/>
                  <rect x="110" y="49" width="19" height="4.5" rx="2.2" fill="var(--renard-brun)" transform="rotate(8 120 51)"/>`;
      bouche = `<path d="M84,103 Q100,115 116,103" stroke="var(--renard-brun)" stroke-width="3.5" stroke-linecap="round" fill="none"/>`; break;
    default:
      sourcils = `<rect x="72" y="53" width="18" height="4" rx="2" fill="var(--renard-brun)" transform="rotate(-5 81 55)"/>
                  <rect x="110" y="53" width="18" height="4" rx="2" fill="var(--renard-brun)" transform="rotate(5 119 55)"/>`;
      bouche = `<path d="M87,104 Q100,111 113,104" stroke="var(--renard-brun)" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  }
  return `
    <circle cx="${82+dx}" cy="${70+dy}" r="5" fill="var(--renard-sombre)"/>
    <circle cx="${118+dx}" cy="${70+dy}" r="5" fill="var(--renard-sombre)"/>
    ${sourcils}
    <path d="M94,78 L106,78 L100,86 Z" fill="var(--renard-sombre)"/>
    ${bouche}
    <circle cx="82" cy="70" r="16" fill="none" stroke="var(--renard-sombre)" stroke-width="3"/>
    <circle cx="118" cy="70" r="16" fill="none" stroke="var(--renard-sombre)" stroke-width="3"/>
    <line x1="98" y1="70" x2="102" y2="70" stroke="var(--renard-sombre)" stroke-width="3"/>
    <line x1="66" y1="68" x2="50" y2="55" stroke="var(--renard-sombre)" stroke-width="2.5"/>
    <line x1="134" y1="68" x2="150" y2="55" stroke="var(--renard-sombre)" stroke-width="2.5"/>
  `;
}

function tobiSVG(humeur, largeur, mini) {
  const vb = mini ? "30 0 140 140" : "0 0 215 222";
  const hauteur = mini ? largeur : Math.round(largeur * 222 / 215);
  const classeAnim = humeur === "celebre" ? "anim-rebond" : (mini ? "" : "anim-respire");
  return `
  <svg class="${mini ? 'tobi-mini' : 'tobi-mascot'} ${classeAnim}" width="${largeur}" height="${hauteur}" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-label="Tobi le renard">
    <path d="M62,46 L40,4 L88,34 Z" fill="var(--renard-orange)" stroke="var(--renard-brun)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M64,40 L49,15 L80,32 Z" fill="var(--renard-creme)"/>
    <path d="M138,46 L160,4 L112,34 Z" fill="var(--renard-orange)" stroke="var(--renard-brun)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M136,40 L151,15 L120,32 Z" fill="var(--renard-creme)"/>
    ${!mini ? `<rect x="68" y="200" width="24" height="14" rx="6" fill="var(--renard-sombre)"/>
    <rect x="108" y="200" width="24" height="14" rx="6" fill="var(--renard-sombre)"/>` : ""}
    <circle cx="100" cy="78" r="46" fill="var(--renard-orange)" stroke="var(--renard-brun)" stroke-width="3"/>
    <ellipse cx="100" cy="95" rx="28" ry="22" fill="var(--renard-creme)" stroke="var(--renard-brun)" stroke-width="3"/>
    ${tobiVisage(humeur)}
    ${!mini ? `
    <path d="M142,155 C190,135 205,185 178,212 C192,185 180,160 138,172 Z" fill="var(--renard-orange)" stroke="var(--renard-brun)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M186,175 C194,190 188,203 175,210 C186,198 186,185 178,175 Z" fill="var(--renard-creme)"/>
    <rect x="56" y="128" width="88" height="78" rx="28" fill="#FFFFFF" stroke="var(--renard-brun)" stroke-width="3"/>
    <path d="M92,128 L108,128 L100,148 Z" fill="var(--rouge)"/>
    <circle cx="100" cy="139" r="5" fill="var(--jaune)"/>
    ${tobiBras("g", humeur)}
    ${tobiBras("d", humeur)}
    ` : ""}
  </svg>`;
}
const SUPABASE_URL = "https://edzzikmtxeslhvowbnix.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkenppa210eGVzbGh2b3dibml4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNjE0MDIsImV4cCI6MjA5OTgzNzQwMn0.i5k6gzYSAaNQyp33LNo0pRCdH0cQuXkTiHx7DqFK6uQ";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById("app");
let etat = { route: "connexion", parentId: null, enfant: null, niveaux: [], matieres: [], params: {}, compteNom: false, profil: null, chaine: null, envoiEnCours: false, lienEnAttente: null };
const LONG_CODE = 6;
try { const m = /[#&]c=([0-9a-f-]{36})/i.exec(location.hash); if (m) etat.lienEnAttente = m[1]; } catch(e) {}

function chargerLocal(cle, defaut) { try { const v = localStorage.getItem(cle); return v ? JSON.parse(v) : defaut; } catch(e) { return defaut; } }
function sauverLocal(cle, val) { try { localStorage.setItem(cle, JSON.stringify(val)); } catch(e) {} }

function estEnLigne() { return navigator.onLine; }

async function appelFonction(nom, corps) {
  const session = (await sb.auth.getSession()).data.session;
  const jeton = session ? session.access_token : SUPABASE_ANON_KEY;
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${nom}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${jeton}`, "apikey": SUPABASE_ANON_KEY },
    body: JSON.stringify(corps)
  });
  return r;
}

  const r = await fetch(`${SUPABASE_URL}/functions/v1/tobi-auth`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
    body: JSON.stringify(corps)
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erreur || "Erreur du serveur, réessayez.");

function estCompteNom(user) { return !!(user && user.user_metadata && user.user_metadata.nom); }

async function ouvrirSession(sessionServeur, code) {
  const { data, error } = await sb.auth.setSession({ access_token: sessionServeur.access_token, refresh_token: sessionServeur.refresh_token });
  if (error || !data.session) throw new Error("Connexion impossible, réessayez.");
  etat.parentId = data.session.user.id;
  etat.compteNom = true;
  await apresConnexion();
  if (PIN.dispo) await PIN.definir(etat.parentId, code);
  router("home");
}

function messageErreur(e, defaut) {
  if (e instanceof TypeError) return "Pas de connexion internet.";
  return (e && e.message) ? e.message : defaut;
}

const voix = {
  file: [], enCours: false,
  parler(texte, onDebut, onFin) {
    if (!('speechSynthesis' in window)) { onFin && onFin(); return; }
    const u = new SpeechSynthesisUtterance(texte);
    u.lang = "fr-FR";
    u.onstart = () => onDebut && onDebut();
    u.onend = () => onFin && onFin();
    u.onerror = () => onFin && onFin();
    speechSynthesis.speak(u);
  },
  ajouter(phrase) {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(phrase);
    u.lang = "fr-FR";
    speechSynthesis.speak(u);
  },
  arreter() { try { speechSynthesis.cancel(); } catch(e) {} }
};

function creerReconnaisseur() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return null;
  const r = new R();
  r.lang = "fr-FR"; r.interimResults = false; r.maxAlternatives = 1;
  return r;
}

function router(route, params = {}) {
  if (!etat.parentId && PROTEGEES.includes(route)) { route = "connexion"; params = { message: "Connectez-vous pour continuer." }; }
  if (etat.envoiEnCours && etat.route === "publier" && route !== "publier") {
    if (!confirm("Un envoi est en cours. Quitter l'annulera. Continuer ?")) return;

  if (route === "home" && etat.lienEnAttente) {
    const id = etat.lienEnAttente; etat.lienEnAttente = null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch(e) {}
    route = "contenu"; params = { id };
  }
  etat.route = route; etat.params = params;
  render();

async function init() {
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      etat.parentId = session.user.id;
      etat.compteNom = estCompteNom(session.user);
      router("nouveau-mot-de-passe");
    }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    etat.parentId = session.user.id;
    etat.compteNom = estCompteNom(session.user);
    await apresConnexion();
    if (etat.compteNom && PIN.dispo && !PIN.existe(etat.parentId)) {

    router(PIN.dispo && PIN.existe(etat.parentId) ? "pin-verrou" : routeApresConnexion());

/* ---------- Code PIN (verrou local de l'appareil) ----------
   Le compte (nom + code) vit côté Supabase ; le code sert aussi de verrou local. Le code à 6 chiffres ouvre
   l'app sur CET appareil ; il est stocké haché (PBKDF2 + sel), jamais en clair.
   5 erreurs => déconnexion complète. */
const PIN = {
  dispo: !!(window.crypto && window.crypto.subtle),
  cle(id) { return "tobi_pin_" + id; },
  existe(id) { return !!chargerLocal(this.cle(id), null); },
  hex(octets) { return Array.from(octets).map(b => b.toString(16).padStart(2, "0")).join(""); },
  octets(h) { return new Uint8Array((h.match(/.{2}/g) || []).map(x => parseInt(x, 16))); },
  async empreinte(pin, sel) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: sel, iterations: 150000, hash: "SHA-256" }, base, 256);
    return this.hex(new Uint8Array(bits));
  },
  async definir(id, pin) {
    const sel = crypto.getRandomValues(new Uint8Array(16));
    sauverLocal(this.cle(id), { sel: this.hex(sel), h: await this.empreinte(pin, sel), essais: 0 });
  },
  async verifier(id, pin) {
    const d = chargerLocal(this.cle(id), null);
    if (!d) return { ok: false, restant: 0 };
    const h = await this.empreinte(pin, this.octets(d.sel));
    if (h === d.h) { d.essais = 0; sauverLocal(this.cle(id), d); return { ok: true }; }
    d.essais = (d.essais || 0) + 1; sauverLocal(this.cle(id), d);
    return { ok: false, restant: Math.max(0, 5 - d.essais) };
  },
  effacer(id) { try { localStorage.removeItem(this.cle(id)); } catch(e) {} }
};

function codeTropFacile(c) {
  return /^(\d)\1{5}$/.test(c) || ["123456", "654321", "012345", "123123", "112233"].includes(c);
}

function routeApresConnexion() {
  return PIN.dispo && !PIN.existe(etat.parentId) ? "pin-creation" : "home";
}

async function deconnecter(message) {
  const id = etat.parentId;
  try { await sb.auth.signOut({ scope: "local" }); } catch(e) {}
  if (id) PIN.effacer(id);
  etat.parentId = null; etat.enfant = null;
  router("connexion", { message: message || "" });
}

function clavierPin(surComplet) {
  let saisie = "", occupe = false;
  const racine = document.createElement("div");
  function maj() {
    racine.innerHTML = `
      <div class="pin-points">${Array.from({ length: LONG_CODE }, (_, i) => i).map(i => `<span class="pin-point ${i < saisie.length ? "plein" : ""}"></span>`).join("")}</div>
      <div class="pin-clavier">${["1","2","3","4","5","6","7","8","9","","0","⌫"].map(t =>
        t === "" ? '<span class="pin-touche vide"></span>'
                 : `<button class="pin-touche" data-t="${t}" aria-label="${t === "⌫" ? "Effacer" : t}">${t}</button>`).join("")}</div>`;
    racine.querySelectorAll("[data-t]").forEach(b => b.onclick = async () => {
      if (occupe) return;
      const t = b.dataset.t;
      if (t === "⌫") { saisie = saisie.slice(0, -1); maj(); return; }
      if (saisie.length >= LONG_CODE) return;
      saisie += t; maj();
      if (saisie.length === LONG_CODE) {
        occupe = true;
        const pin = saisie;
        try { await surComplet(pin); } finally { occupe = false; }
      }
    });
  }
  racine.reinit = () => { saisie = ""; maj(); };
  maj();
  return racine;
}

function vuePinCreation() {
  const changer = !!(etat.params && etat.params.changer);
  let etape = changer ? "ancien" : "nouveau", premier = "", erreur = "";
  const wrap = document.createElement("div");
  wrap.className = "ecran centre";
  const haut = document.createElement("div");
  haut.style.width = "100%";
  const titres = {
    ancien: "Entrez votre code actuel",
    nouveau: changer ? "Choisissez votre nouveau code" : "Choisissez un code à 6 chiffres",
    confirmer: "Confirmez le code"
  };
  function entete() {
    haut.innerHTML = `${tobiSVG("explique", 140)}<h1>${titres[etape]}</h1>
      ${!changer && etape === "nouveau" ? `<p style="margin-top:6px">Ce code ouvre Tobi sur ce téléphone. Sur un autre appareil, vous utiliserez votre e-mail et votre mot de passe.</p>` : ""}
      ${erreur ? `<p class="erreur" style="margin-top:8px">${erreur}</p>` : ""}`;
  }
  const pad = clavierPin(async (pin) => {
    erreur = "";
    if (etape === "ancien") {
      const r = await PIN.verifier(etat.parentId, pin);
      if (r.ok) etape = "nouveau";
      else if (r.restant <= 0) { await deconnecter("Trop d'essais. Reconnectez-vous avec votre e-mail."); return; }
      else erreur = `Code incorrect. Il reste ${r.restant} essai${r.restant > 1 ? "s" : ""}.`;
    } else if (etape === "nouveau") {
      if (codeTropFacile(pin)) erreur = "Ce code est trop facile à deviner. Choisissez-en un autre.";
      else { premier = pin; etape = "confirmer"; }
    } else {
      if (pin === premier) {
        if (changer && etat.compteNom) {
          const { error } = await sb.auth.updateUser({ password: pin });
          if (error) { erreur = "Impossible de changer le code, réessayez."; etape = "nouveau"; premier = ""; entete(); pad.reinit(); return; }
        }
        await PIN.definir(etat.parentId, pin);
        router(changer ? (etat.params.retour || "profil") : "home");
        return;
      }
      erreur = "Les deux codes sont différents. Recommencez."; etape = "nouveau"; premier = "";
    }
    entete(); pad.reinit();
  });
  entete();
  wrap.append(haut, pad);
  if (changer) {
    const retour = document.createElement("button");
    retour.className = "btn-text"; retour.style.marginTop = "16px"; retour.textContent = "Annuler";
    retour.onclick = () => router(etat.params.retour || "profil");
    wrap.appendChild(retour);
  }
  app.appendChild(wrap);
}

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
function fmtDuree(s) {
  if (s == null) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60, p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(x)}` : `${m}:${p(x)}`;
}
function fmtTaille(o) {
  if (o == null) return "";
  if (o >= GO) return (o / GO).toFixed(1).replace(".", ",") + " Go";
  if (o >= MO) return Math.round(o / MO) + " Mo";
  return Math.max(1, Math.round(o / 1024)) + " Ko";
}
function urlMedia(chemin) { return sb.storage.from("yt-media").getPublicUrl(chemin).data.publicUrl; }
function estCreateur() { return !!(etat.profil && (etat.profil.role === "creator_verified" || etat.profil.role === "admin")); }
function erreurReseau(e) { return e instanceof TypeError || (e && /Failed to fetch|NetworkError|Load failed/i.test(e.message || "")); }

      etat.chaine = ch || null;
    }
  } catch (e) {
    if (!etat.profil) etat.profil = { role: "viewer", full_name: null };
  }
}

/* ---------- Publication (créateurs vérifiés) ---------- */
function chargerImage(blob) {
  return new Promise((ok, ko) => {
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); ok(im); };
    im.onerror = () => { URL.revokeObjectURL(u); ko(new Error("Image illisible.")); };
    im.src = u;
  });
}
function versJpeg(source, w, h, max) {
  const r = Math.min(1, max / Math.max(w, h)), cw = Math.max(1, Math.round(w * r)), ch = Math.max(1, Math.round(h * r));
  const cv = document.createElement("canvas");
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(source, 0, 0, cw, ch);
  return new Promise((ok, ko) => cv.toBlob(b => b ? ok(b) : ko(new Error("Conversion impossible.")), "image/jpeg", 0.82));
}
async function reduireImage(blob, max = 640) {
  const im = await chargerImage(blob);
  return versJpeg(im, im.naturalWidth, im.naturalHeight, max);
}
function lireMeta(f, type) {
  return new Promise((ok, ko) => {
    if (type === "pdf" || type === "livre") return ok({ duree: null, vignette: null });
    if (type === "image") return reduireImage(f).then(b => ok({ duree: null, vignette: b }), () => ko(new Error("Image illisible.")));
    const url = URL.createObjectURL(f), el = document.createElement(type === "video" ? "video" : "audio");
    let fini = false;
    const clore = (fn, v) => { if (fini) return; fini = true; clearTimeout(tLecture); clearTimeout(tCapture); URL.revokeObjectURL(url); el.removeAttribute("src"); el.load(); fn(v); };
    const tLecture = setTimeout(() => clore(ko, new Error("Impossible de lire ce fichier (format non reconnu).")), 25000);
    let tCapture = null;
    el.preload = "metadata"; el.muted = true; el.playsInline = true;
    el.onerror = () => clore(ko, new Error("Format non reconnu. Utilisez MP4 (vidéo) ou MP3 / M4A (audio)."));
    el.onloadedmetadata = () => {
      const d = el.duration;
      if (!isFinite(d) || d <= 0) return clore(ko, new Error("Durée illisible : réenregistrez le fichier en MP4 ou MP3."));
      if (type === "audio") return clore(ok, { duree: d, vignette: null });
      clearTimeout(tLecture);
      tCapture = setTimeout(() => clore(ok, { duree: d, vignette: null }), 6000);
      el.onseeked = () => {
        const w = el.videoWidth, h = el.videoHeight;
        if (!w || !h) return clore(ok, { duree: d, vignette: null });
        versJpeg(el, w, h, 640).then(b => clore(ok, { duree: d, vignette: b }), () => clore(ok, { duree: d, vignette: null }));
      };
      try { el.currentTime = Math.min(Math.max(d * 0.1, 0.5), 10, Math.max(d - 0.1, 0)); } catch (e) { clore(ok, { duree: d, vignette: null }); }
    };
    el.src = url;
  });
}
function mimeDe(f, type) {
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  let m = (f.type || "").toLowerCase();
  if (!m || m === "application/octet-stream") m = MIME_EXT[ext] || "";
  m = MIME_SYN[m] || m;
  if (ext === "3gp" && type === "audio") m = "audio/3gpp";
  return m;
}
function mimeCoherent(m, type) {
  if (!EXT_DE_MIME[m]) return false;
  if (type === "video") return m.startsWith("video/");
  if (type === "audio") return m.startsWith("audio/");
  if (type === "image") return m.startsWith("image/");
  if (type === "pdf") return m === "application/pdf";
  return m === "application/pdf" || m === "application/epub+zip";
}
let verrouEcran = null;
async function garderEveille(oui) {
  try {
    if (oui && navigator.wakeLock) verrouEcran = await navigator.wakeLock.request("screen");
    else if (!oui && verrouEcran) { await verrouEcran.release(); verrouEcran = null; }
  } catch (e) { /* facultatif */ }
}
function envoyerFichier(fichier, chemin, mime, surProgres) {
  let upload = null, rejeter = null;
  const promesse = new Promise(async (ok, ko) => {
    rejeter = ko;
    try {
      if (!window.tus) {
        if (fichier.size > 50 * MO) throw new Error("L'outil d'envoi n'a pas pu se charger. Vérifiez la connexion et rechargez la page.");
        const { error } = await sb.storage.from("yt-media").upload(chemin, fichier, { contentType: mime, upsert: false });
        if (error) throw error;
        surProgres(fichier.size, fichier.size);
        return ok();
      }
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error("Session expirée : reconnectez-vous.");
      upload = new tus.Upload(fichier, {
        endpoint: `https://${REF_PROJET}.storage.supabase.co/storage/v1/upload/resumable`,
        retryDelays: [0, 3000, 5000, 10000, 20000, 30000, 60000],
        headers: { authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_ANON_KEY },
        uploadDataDuringCreation: true,
        removeFingerprintOnSuccess: true,
        storeFingerprintForResuming: false,
        metadata: { bucketName: "yt-media", objectName: chemin, contentType: mime, cacheControl: "31536000" },
        chunkSize: 6 * MO,
        onBeforeRequest: async req => { const { data: { session: s } } = await sb.auth.getSession(); if (s) req.setHeader("authorization", `Bearer ${s.access_token}`); },
        onError: e => ko(e),
        onProgress: (a, b) => surProgres(a, b),
        onSuccess: () => ok()
      });
      upload.start();
    } catch (e) { ko(e); }
  });
  return { promesse, annuler: () => { try { if (upload) upload.abort(true); } catch (e) {} if (rejeter) rejeter(new Error("Envoi annulé.")); } };
}
function messageEnvoi(e) {
  const m = String((e && (e.message || e.error)) || e || "");
  if (/annulé/i.test(m)) return "Envoi annulé.";
  if (/413|maximum allowed size|exceeded|too large|Payload/i.test(m)) return "Fichier trop gros pour l'espace de stockage actuel. Sur l'offre gratuite de Supabase la limite est de 50 Mo : passez à l'offre Pro et augmentez « Global file size limit » dans les réglages de stockage.";
  if (/403|401|unauthor|row-level|policy|violates/i.test(m)) return "Vous n'avez pas le droit de publier. Votre compte créateur est-il bien validé ?";
  if (/415|mime|not supported|invalid_mime/i.test(m)) return "Format de fichier non accepté.";
  if (erreurReseau(e)) return "Connexion perdue. Vérifiez votre réseau et réessayez.";
  return "L'envoi a échoué. Réessayez.";
}

    etat.annulerEnvoi = () => { annule = true; if (envoi) envoi.annuler(); arreter(); };
    wrap.querySelector("#annuler").onclick = () => { etat.annulerEnvoi(); erreur = "Envoi annulé."; dessiner(); };
    try {
      envoi = envoyerFichier(fichier, chemin, mime, (a, b) => {
        const p = b ? Math.min(100, Math.floor(a * 100 / b)) : 0;
        if (barre.isConnected) { barre.style.width = p + "%"; pct.textContent = `${p} % · ${fmtTaille(a)} / ${fmtTaille(b)}`; }
      });
      await envoi.promesse;
      const imageCover = cover ? await reduireImage(cover).catch(() => null) : (meta && meta.vignette);
      if (imageCover) {
        const r = await sb.storage.from("yt-media").upload(cheminCover, imageCover, { contentType: "image/jpeg", upsert: false });
        coverEnvoyee = !r.error;
      }
      const ligne = {
        channel_id: etat.chaine.id, title: titre, description: champs.desc.trim() || null, category: champs.cat || "Autre", type,
        fichier_path: chemin, cover_path: coverEnvoyee ? cheminCover : null,
        duration_seconds: meta && meta.duree ? Math.round(meta.duree) : null,
        auteur: type === "livre" ? (champs.auteur.trim() || null) : null,
        taille_octets: fichier.size, mime, status: "published", published_at: new Date().toISOString()
      };
      const { data, error } = await sb.from("yt_contenus").insert(ligne).select(CHAMPS_CONTENU).single();
      if (error) {
        await sb.storage.from("yt-media").remove([chemin, ...(coverEnvoyee ? [cheminCover] : [])]).catch(() => {});
        throw error;
      }
      arreter();
      wrap.innerHTML = `<div class="centre">${tobiSVG("celebre", 130)}<h1>Publié !</h1><p style="margin-top:6px" dir="auto">${esc(titre)} est en ligne.</p></div>
        <button class="btn" id="voir">Voir la publication</button>
        <button class="btn-outline" id="autre">Publier autre chose</button>`;
      wrap.querySelector("#voir").onclick = () => router("contenu", { id: data.id, c: data });
      wrap.querySelector("#autre").onclick = () => router("publier");
    } catch (e) {
      arreter();
      if (annule) return;
      sb.storage.from("yt-media").remove([chemin]).catch(() => {});
      erreur = messageEnvoi(e);
      if (wrap.isConnected) dessiner();
    }
  }
  dessiner();
}

  }

  const v = { nom: "", msg: "" };
  function dessiner() {
    wrap.innerHTML = `
      <div class="centre">${tobiSVG("explique", 120)}<h1>Devenir créateur</h1></div>
      <p>Les créateurs vérifiés peuvent publier des vidéos (jusqu'à 2 h), audios, images, PDF et livres. Chaque demande est examinée avant d'être acceptée.</p>

    if (error) throw error;
    if (!wrap.isConnected) return;
    zone.innerHTML = "";
    if (!data.length) { zone.innerHTML = `<p>Vous n'avez rien publié pour l'instant.</p>`; return; }
    data.forEach(c => {
      const bloc = document.createElement("div");
      bloc.className = "bloc-pub";
      function dessiner() {
        bloc.innerHTML = "";
        bloc.appendChild(carteContenu(c));
        const act = document.createElement("div");
        act.className = "actions-pub";
        act.innerHTML = `<button class="btn-outline" data-a="vis">${c.status === "published" ? "Masquer" : "Republier"}</button><button class="btn-outline" data-a="sup">Supprimer</button>`;
        act.querySelector('[data-a="vis"]').onclick = async () => {
          const nouveau = c.status === "published" ? "hidden" : "published";
          const { error: e } = await sb.from("yt_contenus").update({ status: nouveau }).eq("id", c.id);
          if (e) { alert("Action impossible."); return; }
          c.status = nouveau; dessiner();
        };
        act.querySelector('[data-a="sup"]').onclick = async () => {
          if (!confirm(`Supprimer « ${c.title} » définitivement ?`)) return;
          const { error: e } = await sb.from("yt_contenus").delete().eq("id", c.id);
          if (e) { alert("Suppression impossible."); return; }
          sb.storage.from("yt-media").remove([c.fichier_path, ...(c.cover_path ? [c.cover_path] : [])]).catch(() => {});
          bloc.remove();
          if (!zone.children.length) zone.innerHTML = `<p>Vous n'avez rien publié pour l'instant.</p>`;
        };
        bloc.appendChild(act);
      }
      dessiner();
      zone.appendChild(bloc);
    });
  } catch (e) {
    if (wrap.isConnected) zone.innerHTML = `<p class="erreur">${erreurReseau(e) ? "Pas de connexion internet." : "Chargement impossible."}</p>`;

/* ---------- Fil public : vidéos et images en défilement, lecture automatique ---------- */
function vueFil() {
  const wrap = document.createElement("div");
  wrap.className = "ecran fil";
  wrap.innerHTML = `<div class="pf-entete"><h1>${esc(t("Fil"))}</h1></div><div id="liste" class="liste-contenus"></div><p class="erreur" id="msg" hidden></p><div id="fin" style="height:1px"></div>`;
  app.appendChild(wrap);
  const zone = wrap.querySelector("#liste"), msg = wrap.querySelector("#msg");
  let total = 0, enCours = false, fini = false;
  const lecteurs = new Set();
  const obs = new IntersectionObserver(entrees => {
    entrees.forEach(en => {
      const v = en.target;
      if (en.isIntersecting && en.intersectionRatio >= 0.65) {
        lecteurs.forEach(x => { if (x !== v) x.pause(); });
        v.muted = true;
        const p = v.play(); if (p && p.catch) p.catch(() => {});
      } else if (!v.paused) v.pause();
    });
  }, { threshold: [0, 0.65, 1] });
  function poste(c) {
    const el = document.createElement("article");
    el.className = "poste";
    const url = urlMedia(c.fichier_path), cover = c.cover_path ? urlMedia(c.cover_path) : "";
    const nom = c.yt_channels && c.yt_channels.name ? c.yt_channels.name : APP_NOM;
    const date = c.published_at ? new Date(c.published_at).toLocaleDateString(langue) : "";
    const media = c.type === "video"
      ? `<video class="lecteur-video" controls playsinline muted preload="metadata" ${cover ? `poster="${esc(cover)}"` : ""} src="${esc(url)}"></video>`
      : `<img class="lecteur-image" loading="lazy" alt="${esc(c.title)}" src="${esc(url)}">`;
    el.innerHTML = `<div class="poste-tete"><span class="poste-av">${esc(nom.trim().charAt(0).toUpperCase())}</span><div><b dir="auto">${esc(nom)}</b><br><small>${esc(date)}</small></div></div>
      <div class="poste-titre" dir="auto">${esc(c.title)}</div>${media}
      <div class="poste-pied"><span>${c.views_count || 0} 👁</span><button class="btn-text" data-o="1">${esc(t("Ouvrir"))}</button></div>`;
    el.querySelector("[data-o]").onclick = () => router("contenu", { id: c.id, c });
    const v = el.querySelector("video");
    if (v) { lecteurs.add(v); obs.observe(v); }
    return el;
  }
  async function charger() {
    if (enCours || fini) return;
    enCours = true; msg.hidden = true;
    try {
      let req = sb.from("yt_contenus").select(CHAMPS_CONTENU).eq("status", "published").in("type", ["video", "image"])
        .order("published_at", { ascending: false }).range(total, total + 5);
      const { data, error } = await req;
      if (error) throw error;
      if (!wrap.isConnected) return;
      (data || []).forEach(c => zone.appendChild(poste(c)));
      total += (data || []).length;
      if ((data || []).length < 6) fini = true;
      if (!total) zone.innerHTML = `<div class="centre">${tobiSVG("encourage", 120)}<p style="margin-top:8px">${esc(t("Rien n'a encore été publié."))}</p></div>`;
    } catch (e) {
      msg.textContent = erreurReseau(e) ? "Pas de connexion internet." : "Impossible de charger le fil.";
      msg.hidden = false;
    }
    enCours = false;
    if (wrap.isConnected && !fini) setTimeout(() => { const r = wrap.querySelector("#fin").getBoundingClientRect(); if (r.top < innerHeight + 300) charger(); }, 50);
  }
  const suite = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) charger(); }, { rootMargin: "400px" });
  suite.observe(wrap.querySelector("#fin"));
  charger();
}

/* ---------- Partie Arabe : invocations et livres ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

async function chargerTout(table, colonnes, ordres) {
  const sortie = [], pas = 1000;
  for (let debut = 0; ; debut += pas) {
    let q = sb.from(table).select(colonnes);
    ordres.forEach(o => { q = q.order(o); });
    const { data, error } = await q.range(debut, debut + pas - 1);
    if (error) throw error;
    sortie.push(...data);
    if (data.length < pas) break;
  }
  return sortie;
}

async function donneesArabe(cle, table, colonnes, ordres) {
  try {
    const d = await chargerTout(table, colonnes, ordres);
    sauverLocal(cle, d);
    return d;
  } catch(e) {
    return chargerLocal(cle, []);
  }
}

function lireArabe(texte) {
  if (!('speechSynthesis' in window)) return;
  voix.arreter();
  const u = new SpeechSynthesisUtterance(texte);
  u.lang = "ar-SA";
  speechSynthesis.speak(u);
}

const LIBELLE_GRADE = { coran: "Coran", sahih: "Hadith authentique (sahih)", hasan: "Hadith bon (hasan)" };

async function vueArabe() {
  let onglet = (etat.params && etat.params.onglet) || "duas", categorie = null;
  let duas = null, livres = null;
  const wrap = document.createElement("div");
  wrap.className = "ecran";
  app.appendChild(wrap);

  function squelette() {
    wrap.innerHTML = `
      <div class="entete" style="padding:0"><button class="btn-text" id="retour" style="padding:4px">←</button><h1>Arabe</h1></div>
      <div class="onglets">
        <button class="onglet ${onglet === "duas" ? "actif" : ""}" data-o="duas">🤲 Invocations</button>
        <button class="onglet ${onglet === "livres" ? "actif" : ""}" data-o="livres">📚 Livres</button>
      </div>
      <div id="contenu" style="display:flex;flex-direction:column;gap:10px"></div>`;
    wrap.querySelector("#retour").onclick = () => { voix.arreter(); router("home"); };
    wrap.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { onglet = b.dataset.o; categorie = null; afficher(); });
  }

  async function afficher() {
    voix.arreter();
    squelette();
    const zone = wrap.querySelector("#contenu");
    zone.innerHTML = `<div class="centre"><div class="spinner"></div></div>`;
    if (onglet === "duas") {
      if (!duas) duas = await donneesArabe("cache_duas", "duas_arabe",
        "id,categorie,titre_fr,texte_ar,traduction_fr,traduction_en,reference,grade", ["categorie", "id"]);
      listeDuas(zone);
    } else {
      if (!livres) livres = await donneesArabe("cache_livres", "livres_islamiques",
        "id,categorie,titre_ar,titre_fr,auteur_fr,deces_hijri,fichier_url", ["categorie", "id"]);
      listeLivres(zone);
    }
  }

  function listeDuas(zone) {
    if (!duas.length) { zone.innerHTML = `<div class="centre">${tobiSVG("encourage", 140)}<p>Les invocations arrivent bientôt.</p></div>`; return; }
    const cats = [...new Set(duas.map(d => d.categorie))];
    if (!categorie || !cats.includes(categorie)) categorie = cats[0];
    zone.innerHTML = `<div class="chips" id="chips"></div><div id="items" style="display:flex;flex-direction:column;gap:10px"></div>`;
    const chips = zone.querySelector("#chips");
    cats.forEach(c => {
      const b = document.createElement("button");
      b.className = "chip" + (c === categorie ? " actif" : "");
      b.textContent = c;
      b.onclick = () => { categorie = c; voix.arreter(); listeDuas(zone); };
      chips.appendChild(b);
    });
    const items = zone.querySelector("#items");
    duas.filter(d => d.categorie === categorie).forEach(d => {
      const c = document.createElement("div");
      c.className = "carte";
      const trad = d.traduction_fr || d.traduction_en || "";
      c.innerHTML = `
        <b style="font-size:14px">${esc(d.titre_fr)}</b>
        <div class="texte-arabe dua-ar" dir="rtl" lang="ar">${esc(d.texte_ar)}</div>
        ${trad ? `<div class="dua-fr">${esc(trad)}</div>` : ""}
        <div class="dua-ref"><span>📖 ${esc(d.reference)}${d.grade ? " · " + esc(LIBELLE_GRADE[d.grade] || d.grade) : ""}</span>
        <button class="btn-ecoute" aria-label="Écouter">🔊</button></div>`;
      c.querySelector(".btn-ecoute").onclick = () => lireArabe(d.texte_ar);
      items.appendChild(c);
    });
  }

  function listeLivres(zone) {
    if (!livres.length) { zone.innerHTML = `<div class="centre">${tobiSVG("encourage", 140)}<p>Les livres arrivent bientôt.</p></div>`; return; }
    zone.innerHTML = "";
    let derniere = null;
    livres.forEach(l => {
      if (l.categorie !== derniere) {
        derniere = l.categorie;
        const h = document.createElement("h2");
        h.style.marginTop = "8px"; h.textContent = l.categorie;
        zone.appendChild(h);
      }
      const c = document.createElement("div");
      c.className = "carte";
      const lien = l.fichier_url && /^https:\/\//.test(l.fichier_url)
        ? `<a class="lien-livre" href="${esc(l.fichier_url)}" target="_blank" rel="noopener">📖 Ouvrir le livre</a>`
        : `<p style="margin-top:8px;font-size:12px">Texte bientôt disponible</p>`;
      c.innerHTML = `
        <div class="texte-arabe livre-ar" dir="rtl" lang="ar">${esc(l.titre_ar)}</div>
        <b style="font-size:15px">${esc(l.titre_fr)}</b>
        <p style="margin-top:4px">${esc(l.auteur_fr)}${l.deces_hijri ? " (m. " + esc(l.deces_hijri) + " H)" : ""}</p>
        ${lien}`;
      zone.appendChild(c);
    });
  }

  afficher();
}

function vueMotDePasseOublie() {
  let erreur = "", envoye = false, enCours = false, legacy = false;
  const wrap = document.createElement("div");
  wrap.className = "ecran centre";
  function dessiner() {
    wrap.innerHTML = `
      ${tobiSVG("idle", 160)}
      <h1>Code oublié</h1>
      ${envoye
        ? `<p style="margin-top:8px">${legacy
              ? "Si un compte existe avec cet e-mail, un lien de réinitialisation vient d'être envoyé. Vérifiez aussi vos spams."
              : "Si un e-mail de récupération est enregistré pour ce nom, un lien vient d'être envoyé (vérifiez aussi les spams). Sans e-mail de récupération, il faut créer un nouveau compte."}</p>
           <button class="btn" id="retour" style="margin-top:16px">Retour à la connexion</button>`
        : `<p style="margin-top:8px">Entrez votre nom. Si vous avez donné un e-mail à l'inscription, on vous envoie un lien pour choisir un nouveau code. (Ancien compte : entrez votre e-mail.)</p>
           <input class="champ" id="ident" placeholder="Votre nom ou e-mail" style="margin-top:12px">
           ${erreur ? `<p class="erreur">${esc(erreur)}</p>` : ""}
           <button class="btn" id="go" ${enCours ? "disabled" : ""}>${enCours ? "..." : "Envoyer le lien"}</button>
           <button class="btn-text" id="retour">Retour à la connexion</button>`
      }
    `;
    wrap.querySelector("#retour").onclick = () => router("connexion");
    const go = wrap.querySelector("#go");
    if (go) go.onclick = async () => {
      const ident = wrap.querySelector("#ident").value.trim();
      if (ident.length < 3) { erreur = "Entrez votre nom ou votre e-mail"; dessiner(); return; }
      enCours = true; erreur = ""; dessiner();
      try {
        const redirect = location.origin + location.pathname;
        if (ident.includes("@")) {
          legacy = true;
          await sb.auth.resetPasswordForEmail(ident, { redirectTo: redirect });
        } else {
          legacy = false;
          await appelAuth({ action: "oublie", nom: ident, redirect });
        }
        envoye = true;
      } catch(e) {
        erreur = messageErreur(e, "Envoi impossible, réessayez.");
      }
      enCours = false; dessiner();
    };
  }
  dessiner();
  app.appendChild(wrap);
}

function vueNouveauMotDePasse() {
  const parCode = etat.compteNom;
  let erreur = "", enCours = false;
  const wrap = document.createElement("div");
  wrap.className = "ecran centre";
  function dessiner() {
    wrap.innerHTML = `
      ${tobiSVG("idle", 160)}
      <h1>${parCode ? "Choisissez un nouveau code" : "Choisissez un nouveau mot de passe"}</h1>
      ${parCode
        ? `<input class="champ" id="mdp" type="password" inputmode="numeric" maxlength="${LONG_CODE}" autocomplete="off" placeholder="Nouveau code à 6 chiffres" style="margin-top:12px">
           <input class="champ" id="mdp2" type="password" inputmode="numeric" maxlength="${LONG_CODE}" autocomplete="off" placeholder="Confirmez le code">`
        : `<input class="champ" id="mdp" type="password" placeholder="Nouveau mot de passe (6 caractères min.)" style="margin-top:12px">
           <input class="champ" id="mdp2" type="password" placeholder="Confirmez le mot de passe">`}
      ${erreur ? `<p class="erreur">${esc(erreur)}</p>` : ""}
      <button class="btn" id="go" ${enCours ? "disabled" : ""}>${enCours ? "..." : "Enregistrer"}</button>
    `;
    wrap.querySelector("#go").onclick = async () => {
      const mdp = wrap.querySelector("#mdp").value;
      const mdp2 = wrap.querySelector("#mdp2").value;
      if (parCode) {
        if (!/^\d{6}$/.test(mdp)) { erreur = "Le code doit faire exactement 6 chiffres"; dessiner(); return; }
        if (codeTropFacile(mdp)) { erreur = "Ce code est trop facile à deviner. Choisissez-en un autre."; dessiner(); return; }
        if (mdp !== mdp2) { erreur = "Les deux codes sont différents"; dessiner(); return; }
      } else {
        if (mdp.length < 6) { erreur = "Le mot de passe doit faire au moins 6 caractères"; dessiner(); return; }
        if (mdp !== mdp2) { erreur = "Les deux mots de passe ne correspondent pas"; dessiner(); return; }
      }
      enCours = true; erreur = ""; dessiner();
      try {
        const { data, error } = await sb.auth.updateUser({ password: mdp });
        if (error) throw error;
        etat.parentId = data.user.id;
        if (parCode && PIN.dispo) await PIN.definir(etat.parentId, mdp);
        await apresConnexion();
        router(routeApresConnexion());
        return;
      } catch(e) {
        erreur = messageErreur(e, "Impossible d'enregistrer.");
      }
      enCours = false; dessiner();
    };
  }
  dessiner();
  app.appendChild(wrap);
}

    carte.style.marginTop = "10px"; carte.style.display = "flex"; carte.style.justifyContent = "space-between"; carte.style.cursor = "pointer";
    carte.innerHTML = `<b style="font-size:18px">${e.prenom}</b><span>${niveau ? niveau.nom : ""}</span>`;
    carte.onclick = () => { etat.enfant = { ...e, niveau_nom: niveau ? niveau.nom : "" }; router("accueil"); };
    liste.appendChild(carte);
  });

  const bouton = document.createElement("button");
  bouton.className = "btn-outline"; bouton.style.marginTop = "16px"; bouton.textContent = "Ajouter un enfant";
  bouton.onclick = () => router("inscription");

}

function vueInscription() {
  let erreur = "", niveauChoisi = null;
  const wrap = document.createElement("div");
  wrap.className = "ecran centre";
  function dessiner() {
    wrap.innerHTML = `
      ${tobiSVG("explique", 160)}
      <h1>Bonjour ! Moi c'est Tobi.</h1><p>Et toi, comment tu t'appelles ?</p>
      <input class="champ" id="prenom" placeholder="Prénom de l'enfant" style="margin-top:12px">
      <input class="champ" id="prononciation" placeholder="Comment le prononcer (facultatif)">
      <div style="align-self:flex-start;font-weight:600;margin:6px 0">Sa classe</div>
      <div class="chips" id="chips"></div>
      ${erreur ? `<p class="erreur">${erreur}</p>` : ""}
      <button class="btn" id="go" style="margin-top:16px">C'est parti avec Tobi !</button>
    `;
    const chips = wrap.querySelector("#chips");
    etat.niveaux.forEach(n => {
      const c = document.createElement("button");
      c.className = "chip" + (niveauChoisi && niveauChoisi.id === n.id ? " actif" : "");
      c.textContent = n.code;
      c.onclick = () => { niveauChoisi = n; dessiner(); };
      chips.appendChild(c);
    });
    wrap.querySelector("#go").onclick = async () => {
      const prenom = wrap.querySelector("#prenom").value.trim();
      const prononciation = wrap.querySelector("#prononciation").value.trim();
      if (!prenom) { erreur = "Écris le prénom de l'enfant"; dessiner(); return; }
      if (!niveauChoisi) { erreur = "Choisis sa classe"; dessiner(); return; }
      try {
        const { data, error } = await sb.from("enfants").insert({ parent_id: etat.parentId, prenom, niveau_id: niveauChoisi.id }).select().single();
        if (error) throw error;
        etat.enfant = { ...data, prononciation, niveau_nom: niveauChoisi.nom };
        sauverLocal("prononciation_" + data.id, prononciation);
        router("accueil");
      } catch(e) { erreur = "Erreur de connexion, réessaie."; dessiner(); }
    };
  }
  dessiner();
  app.appendChild(wrap);
}

        <input type="radio" ${mode === "ardoise" ? "checked" : ""}><div><b>L'ardoise</b><br><span style="font-size:13px;color:var(--texte-doux)">Il écrit avec son doigt. Conseillé SIL à CE1.</span></div>
      </div>
      <div class="carte" id="opt-clavier" style="margin-top:10px;cursor:pointer;display:flex;gap:10px;align-items:center">

function vueChangerMotDePasse() {
  let erreur = "", succes = false, enCours = false;
  const wrap = document.createElement("div");
  wrap.className = "ecran centre";
  function dessiner() {
    wrap.innerHTML = `
      <h1>Changer le mot de passe</h1>
      <input class="champ" id="mdp" type="password" placeholder="Nouveau mot de passe (6 caractères min.)" style="margin-top:12px">
      <input class="champ" id="mdp2" type="password" placeholder="Confirmez le mot de passe">
      ${erreur ? `<p class="erreur">${erreur}</p>` : ""}
      ${succes ? `<p style="color:var(--vert);font-weight:600">Mot de passe mis à jour !</p>` : ""}
      <button class="btn" id="go" ${enCours ? "disabled" : ""}>${enCours ? "..." : "Enregistrer"}</button>
      <button class="btn-text" id="retour">Retour</button>
    `;
    wrap.querySelector("#retour").onclick = () => router("profil");
    wrap.querySelector("#go").onclick = async () => {
      const mdp = wrap.querySelector("#mdp").value;
      const mdp2 = wrap.querySelector("#mdp2").value;
      if (mdp.length < 6) { erreur = "Le mot de passe doit faire au moins 6 caractères"; succes = false; dessiner(); return; }
      if (mdp !== mdp2) { erreur = "Les deux mots de passe ne correspondent pas"; succes = false; dessiner(); return; }
      enCours = true; erreur = ""; dessiner();
      try {
        const { error } = await sb.auth.updateUser({ password: mdp });
        if (error) throw error;
        succes = true;
      } catch(e) {
        erreur = (e && e.message) ? e.message : "Impossible d'enregistrer le mot de passe.";
      }
      enCours = false; dessiner();
    };
  }
  dessiner();
  app.appendChild(wrap);
}

async function vueDialogue() {
  const lecon = etat.params.lecon;
  const matiereId = etat.params.matiereId;
  const prononciation = chargerLocal("prononciation_" + etat.enfant.id, "");
  const modeEcriture = chargerLocal("mode_ecriture", "ardoise");

  let dialogueId = null, messages = [], enAttente = true, leconTerminee = false, ecritTableau = null;
  let tobiParle = false, enLigne = estEnLigne();

  const wrap = document.createElement("div");
  wrap.className = "ecran"; wrap.style.padding = "0"; wrap.style.gap = "0";
  app.appendChild(wrap);

  function tpl() {
    wrap.innerHTML = `
      ${!enLigne ? '<div class="bandeau-hors-ligne">Pas de connexion — Tobi ne peut pas continuer le cours en direct</div>' : ""}
      <div class="top-bar">
        <button class="btn-text" id="retour" style="padding:2px">←</button>
        <b style="font-size:14px">${lecon.titre}</b>
        <span style="width:24px"></span>
      </div>
      ${enLigne && !tobiParle && !leconTerminee ? '<div class="ecoute-badge">👂 Tobi écoute</div>' : ""}
      <div class="tableau-zone">
        <div class="tableau" id="tableau"></div>
      </div>
      <div class="messages" id="messages"></div>
      <div id="saisie"></div>
    `;
    wrap.querySelector("#retour").onclick = () => router("lecons", { matiere: etat.matieres.find(m => m.id === matiereId) });
    dessinerTableau();
    dessinerMessages();
    dessinerSaisie();
  }

  function dessinerTableau() {
    const t = wrap.querySelector("#tableau");
    if (t) t.textContent = ecritTableau || "";
  }

  function dessinerMessages() {
    const m = wrap.querySelector("#messages");
    if (!m) return;
    m.innerHTML = "";
    messages.forEach(msg => {
      const estTobi = msg.role === "tobi";
      const ligne = document.createElement("div");
      ligne.className = "ligne-bulle " + (estTobi ? "tobi" : "enfant");
      if (estTobi) {
        const avatar = document.createElement("div");
        avatar.innerHTML = tobiSVG("idle", 30, true);
        ligne.appendChild(avatar.firstElementChild);
      }
      const b = document.createElement("div");
      b.className = "bulle " + (estTobi ? "tobi" : "enfant");
      b.textContent = msg.contenu;
      ligne.appendChild(b);
      m.appendChild(ligne);
    });
    if (enAttente) {
      const ligne = document.createElement("div");
      ligne.className = "ligne-bulle tobi";
      const avatar = document.createElement("div");
      avatar.innerHTML = tobiSVG("reflechit", 30, true);
      ligne.appendChild(avatar.firstElementChild);
      const b = document.createElement("div");
      b.className = "bulle tobi"; b.style.fontStyle = "italic"; b.textContent = "Tobi réfléchit…";
      ligne.appendChild(b);
      m.appendChild(ligne);
    }
    if (leconTerminee) {
      const fin = document.createElement("div");
      fin.className = "centre";
      fin.innerHTML = tobiSVG("celebre", 110);
      m.appendChild(fin);
    }
    m.scrollTop = m.scrollHeight + 500;
  }

  function dessinerSaisie() {
    const s = wrap.querySelector("#saisie");
    if (!s) return;
    if (leconTerminee) {
      s.innerHTML = `<p style="text-align:center;padding:20px;font-weight:600;color:var(--texte)">Leçon terminée, bravo ! 🎉</p>`;
      return;
    }
    if (modeEcriture === "ardoise") {
      s.innerHTML = `
        <div style="display:flex;justify-content:flex-end;padding:6px 12px"><button class="rond-bouton" id="micro">🎤</button></div>
        <div class="ardoise-cadre">
          <div class="ardoise-corps">
            <canvas class="ardoise-canvas" id="canvas"></canvas>
            <div class="outils-ardoise">
              <div class="outil actif" id="outil-craie">✏️</div>
              <div class="outil" id="outil-gomme">🧽</div>
              <div class="outil" id="outil-effacer">🗑️</div>
            </div>
          </div>
          <button class="bouton-montrer" id="montrer">Montrer à Tobi</button>
        </div>
        <div style="height:12px"></div>
      `;
      initArdoise();
    } else {
      s.innerHTML = `
        <div class="barre-saisie">
          <input class="champ-saisie" id="texte" placeholder="Écris ta réponse…" ${enAttente || !enLigne ? "disabled" : ""}>
          <button class="rond-bouton" id="envoyer" ${enAttente || !enLigne ? "disabled" : ""}>➤</button>
          <button class="rond-bouton" id="micro" ${enAttente || !enLigne ? "disabled" : ""}>🎤</button>
        </div>
      `;
      wrap.querySelector("#envoyer").onclick = () => {
        const v = wrap.querySelector("#texte").value.trim();
        if (v) envoyerReponse(v, "texte");
      };
      wrap.querySelector("#texte").onkeydown = (e) => { if (e.key === "Enter") wrap.querySelector("#envoyer").click(); };
    }
    const micro = wrap.querySelector("#micro");
    if (micro) micro.onclick = () => lancerMicro();
  }

  function lancerMicro() {
    const r = creerReconnaisseur();
    if (!r) { alert("Micro non disponible sur ce navigateur."); return; }
    r.onresult = (ev) => { const texte = ev.results[0][0].transcript; envoyerReponse(texte, "audio"); };
    r.onerror = () => {};
    try { r.start(); } catch(e) {}
  }

  let ctx, dessin = false, modeGomme = false, dernierPoint = null;
  function initArdoise() {
    const canvas = wrap.querySelector("#canvas");
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = (rect.width - 46) * 2; canvas.height = 260;
    canvas.style.width = (rect.width - 46) + "px"; canvas.style.height = "130px";
    ctx = canvas.getContext("2d");
    ctx.scale(2,1);
    ctx.strokeStyle = "#F5F2E8"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";

    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left), y: (t.clientY - r.top) };
    }
    function debut(e) { e.preventDefault(); dessin = true; dernierPoint = pos(e); }
    function bouger(e) {
      if (!dessin) return; e.preventDefault();
      const p = pos(e);
      if (modeGomme) { ctx.clearRect(p.x-15, p.y-15, 30, 30); }
      else { ctx.beginPath(); ctx.moveTo(dernierPoint.x, dernierPoint.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      dernierPoint = p;
    }
    function fin(e) { dessin = false; }
    canvas.addEventListener("mousedown", debut); canvas.addEventListener("mousemove", bouger); window.addEventListener("mouseup", fin);
    canvas.addEventListener("touchstart", debut, {passive:false}); canvas.addEventListener("touchmove", bouger, {passive:false}); canvas.addEventListener("touchend", fin);

    wrap.querySelector("#outil-craie").onclick = () => { modeGomme = false; wrap.querySelector("#outil-craie").classList.add("actif"); wrap.querySelector("#outil-gomme").classList.remove("actif"); };
    wrap.querySelector("#outil-gomme").onclick = () => { modeGomme = true; wrap.querySelector("#outil-gomme").classList.add("actif"); wrap.querySelector("#outil-craie").classList.remove("actif"); };
    wrap.querySelector("#outil-effacer").onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
    wrap.querySelector("#montrer").onclick = () => envoyerArdoise(canvas);
  }

  async function envoyerArdoise(canvas) {
    const bouton = wrap.querySelector("#montrer");
    bouton.disabled = true; bouton.textContent = "Tobi lit…";
    const base64 = canvas.toDataURL("image/png").split(",")[1];
    try {
      const r = await appelFonction("lire-ardoise", { image_base64: base64, contexte: ecritTableau || lecon.titre });
      const res = await r.json();
      if (res.lecture) {
        const msg = res.alternatives && res.alternatives.length
          ? `${res.lecture} [écrit à la main, autres lectures possibles : ${res.alternatives.join(" / ")}]`
          : res.lecture;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        envoyerReponse(msg, "ardoise");
      } else {
        bouton.disabled = false; bouton.textContent = "Montrer à Tobi";
        alert("Je n'ai pas bien vu, réessaie !");
      }
    } catch(e) { bouton.disabled = false; bouton.textContent = "Montrer à Tobi"; }
  }

  async function envoyerReponse(texte, type) {
    messages.push({ role: "enfant", contenu: texte });
    dessinerMessages();
    await tourAvecFlux(texte, type);
  }

  async function tourAvecFlux(messageEnfant, type) {
    enAttente = true; tpl();
    let indexBulle = -1;
    voix.arreter();
    if (messageEnfant) voix.ajouter(["Hmm…","Voyons voir…","Alors…","D'accord…"][Math.floor(Math.random()*4)]);

    try {
      const historique = messages.map(m => ({ role: m.role, contenu: m.contenu }));
      const r = await appelFonction("dialoguer", {
        titre_lecon: lecon.titre, contenu_texte: lecon.contenu_texte || "",
        historique, message_enfant: messageEnfant, prenom_enfant: etat.enfant.prenom,
        profil_alignement: null, evenement: null
      });
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let tampon = "", metaLigne = null, texteComplet = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        tampon += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = tampon.indexOf("\n")) >= 0) {
          const ligne = tampon.slice(0, idx).trim(); tampon = tampon.slice(idx+1);
          if (!ligne) continue;
          if (ligne.startsWith("§§") || (ligne.startsWith("{") && ligne.includes("message_tobi"))) {
            metaLigne = ligne; continue;
          }
          texteComplet += (texteComplet ? " " : "") + ligne;
          enAttente = false;
          if (indexBulle < 0) { messages.push({ role: "tobi", contenu: ligne }); indexBulle = messages.length - 1; }
          else { messages[indexBulle].contenu += " " + ligne; }
          dessinerMessages();
          voix.ajouter(ligne);
        }
      }
      let meta = {};
      if (metaLigne) {
        try {
          if (metaLigne.startsWith("§§")) meta = JSON.parse(metaLigne.slice(2));
          else { const anc = JSON.parse(metaLigne); meta = anc; if (!texteComplet) { messages.push({role:"tobi",contenu:anc.message_tobi}); voix.ajouter(anc.message_tobi); } }
        } catch(e) {}
      }
      if (meta.ecrit_au_tableau) ecritTableau = meta.ecrit_au_tableau;
      leconTerminee = !!meta.lecon_terminee;
      dessinerTableau();
    } catch(e) {
      messages.push({ role: "tobi", contenu: `Oups, la connexion a coupé. Tu peux répéter, ${etat.enfant.prenom} ?` });
    }
    enAttente = false;
    tpl();
  }

  tpl();
  try {
    const { data, error } = await sb.from("dialogues").insert({ enfant_id: etat.enfant.id, lecon_id: lecon.id }).select().single();
    if (error) throw error;
    dialogueId = data.id;
    await tourAvecFlux(null, null);
  } catch(e) {
    enAttente = false;
    messages.push({ role: "tobi", contenu: "Je n'arrive pas à me connecter. Vérifie ta connexion et reviens." });
    tpl();
  }

  window.addEventListener("online", () => { enLigne = true; tpl(); });
  window.addEventListener("offline", () => { enLigne = false; tpl(); });
}

init();
</script>
